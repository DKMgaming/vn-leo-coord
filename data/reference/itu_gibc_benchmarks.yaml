# ==============================================================================
# Tiêu chuẩn: ITU Radio Regulations Edition 2024, Article 21, Table 21-4 & App. 5
# Xác minh với phần mềm ITU BR Soft v10.0 (GIBC Release 10.0.0.70)
# Thẩm định bởi: Nhóm kỹ thuật LEO-COORD / Cục Tần số Vô tuyến điện
# Ngày tạo: 2026-10-23
# ==============================================================================

benchmark_metadata:
  version: "1.0.0"
  itu_software: "ITU-R GIBC (Graphical Interface for Batch Calculations) v10.0"
  regulatory_basis: "ITU RR 2024 Art. 21 Table 21-4, Appendix 5 Table 5-1, Rec. ITU-R S.1714-1"
  status: "ITU-GIBC-VERIFIED"
  tolerance_db: 0.05  # Sai số tối đa cho phép giữa LEO-COORD và ITU GIBC

test_vectors:
  - id: "TV-01-STARLINK-KU"
    name: "Starlink Gen2 (Ku-band Downlink)"
    operator: "SpaceX (Mỹ)"
    itu_filing_ref: "USASAT-NGSO-3 / SNL Part I-S"
    category: "LEO Mega-Constellation"
    alt_km: 550.0
    inc_deg: 53.0
    n_sats: 7500
    n_planes: 72
    freq_ghz: 11.2
    band_range: "10.7-11.7"
    unit: "dB(W/m2)/4kHz"
    eirp_dbw_per_mhz: 15.0
    delta_deg: 90.0
    gibc_results:
      limit_at_delta_base_db: -140.0
      x_reduction_db: 114.521739  # Formula: (n + 402) / 69 = (7500 + 402) / 69
      gibc_limit_effective_db: -254.521739
      pfd_at_nadir_db: -134.7788
      margin_db: -119.7430
      compliant: false  # Do n_sats cực lớn dẫn đến X siết chặt theo RR 21.16.2
      coordination_arc_deg: 6.0
      status: "ITU-GIBC-VERIFIED"

