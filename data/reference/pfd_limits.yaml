# ==============================================================================
# BẢNG THAM CHIẾU GIỚI HẠN MẬT ĐỘ THÔNG LƯỢNG CÔNG SUẤT (PFD)
# ==============================================================================
# Căn cứ pháp lý: ITU Radio Regulations Edition 2024, Article 21, Section V, Table 21-4
# Trạng thái xác minh: ITU-OFFICIAL-VERIFIED (Đã đối chiếu văn bản gốc Thể lệ Vô tuyến ITU)
# Thẩm định bởi: Cục Tần số Vô tuyến điện — Phòng Tiêu chuẩn & Quy hoạch Tần số
# Ngày thẩm định: 2026-10-22
# ==============================================================================

table_metadata:
  table_id: "ITU-RR-T21-4"
  title: "Giới hạn PFD trên bề mặt Trái đất từ trạm không gian (RR Article 21 Table 21-4)"
  document_reference: "ITU Radio Regulations Edition 2024, Vol. 1, Article 21, Section V, Table 21-4"
  wrc_edition: "WRC-23 Final Acts / ITU RR 2024"
  legal_status: "Ràng buộc pháp lý quốc tế (ITU Treaty)"
  verification_status: "ITU-OFFICIAL-VERIFIED"
  verified_by: "Phòng Tiêu chuẩn & Quy hoạch Tần số (Cục Tần số VTĐ)"
  verified_date: "2026-10-22"
  cross_check_sources:
    - "FCC 47 CFR §25.208 (Power flux-density limits)"
    - "CEPT ECC Decision (04)08 & (05)11"
    - "Vietnam National Frequency Allocation Plan (Quyết định số 71/2013/QĐ-TTg & sửa đổi)"

general_rules:
  formula_description: >
    Giới hạn PFD được xác định dưới dạng hàm từng khúc theo góc tới delta (góc ngẩng so với mặt phẳng nằm ngang):
    - Khi delta <= 5°: limit = delta_le_5
    - Khi 5° < delta < 25°: limit = delta_le_5 + slope * (delta - 5.0)
    - Khi delta >= 25°: limit = delta_ge_25
  ngso_constellation_rule: >
    Đối với các chòm sao phi địa tĩnh (NGSO) có từ 51 vệ tinh trở lên (n_sats >= 51),
    ngưỡng giới hạn PFD được siết chặt thêm bằng cách trừ đi hệ số suy giảm X (dB) (RR No. 21.16.2 / 47 CFR 2.106 Footnote 21.16):
    - Nếu 51 <= n <= 288: X = (5 / 119) * (n - 50)
    - Nếu n > 288: X = (1 / 69) * (n + 402)
    Điều này đảm bảo tổng can nhiễu tích lũy từ nhiều búp sóng vệ tinh không vượt ngưỡng bảo vệ dịch vụ mặt đất (Fixed Service).

